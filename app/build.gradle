plugins {
    id 'com.android.application'
}

android {
    namespace 'com.browserlite'
    compileSdk 34

    defaultConfig {
        applicationId 'com.browserlite'
        minSdk 19
        targetSdk 28
        versionCode 2
        versionName '1.1'
        ndk {
            // Android 4.4 e-ink readers are ARMv7; x86 kept for emulators.
            abiFilters 'armeabi-v7a', 'x86'
        }
    }

    signingConfigs {
        shared {
            storeFile file('../keystore/browserlite.keystore')
            storePassword 'browserlite'
            keyAlias 'browserlite'
            keyPassword 'browserlite'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        // Side-loaded browser for Android 4.4 devices, not a Play Store upload.
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'CustomX509TrustManager', 'SetJavaScriptEnabled'
    }
}

dependencies {
    // Last OkHttp line that supports Android 4.x (API 9+).
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // BoringSSL-based TLS 1.3 provider; 2.5.x is the last release with minSdk < 21.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
