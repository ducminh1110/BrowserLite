name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Injected scripts are up to date and ES5
        run: |
          ./tools/build-web.sh
          git diff --exit-code app/src/main/assets/web

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature works on Android 4.4 (v1 scheme)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify -v --min-sdk-version 19 app/build/outputs/apk/release/app-release.apk | grep "v1 scheme (JAR signing): true"

      - uses: actions/upload-artifact@v4
        with:
          name: BrowserLite-apk
          path: app/build/outputs/apk/release/app-release.apk
